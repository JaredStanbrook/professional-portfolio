name: CI

on:
    push:
        branches: [main, develop]
    pull_request:
        branches: [main, develop]

jobs:
    test:
        name: Test & Lint
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - name: Install dependencies
              run: bun install

            # Generates worker-configuration.d.ts (gitignored) so the Cloudflare
            # runtime types exist before linting and type checking.
            - name: Generate worker types
              run: bunx wrangler types

            - name: Run linter
              run: bun run lint

            # Non-blocking: the codebase currently has pre-existing type errors,
            # which is also why `bun run build` tolerates a failing tsc. Flip this
            # to a hard gate once they are cleared.
            - name: Run type check
              run: bun run typecheck
              continue-on-error: true

            - name: Run tests
              run: bun run test:run

    build:
        name: Build
        runs-on: ubuntu-latest
        needs: test

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - name: Install dependencies
              run: bun install

            - name: Generate worker types
              run: bunx wrangler types

            - name: Build project
              run: bun run build

            - name: Upload build artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: dist
                  path: dist/
                  retention-days: 7

    deploy:
        name: Deploy to Cloudflare
        needs: [test, build]
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: ./.github/workflows/deploy.yml
        with:
            environment: production
            run_migrations: true
        secrets: inherit
